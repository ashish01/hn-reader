<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            let dark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
            try {
                const saved = localStorage.getItem("darkMode");
                if (saved !== null) dark = saved === "true";
            } catch { /* Use the OS preference when storage is unavailable. */ }
            document.documentElement.classList.toggle("dark-mode", dark);
        </script>
        <style>
            html { background: #fff; color-scheme: light; }
            html.dark-mode { background: #121212; color-scheme: dark; }
        </style>
        <title>HN Reader</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
